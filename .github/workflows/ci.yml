name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  test-cookiecutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install stylua, selene, ast-grep
        run: cargo binstall -y stylua selene ast-grep

      - name: Install lua-language-server
        run: |
          mkdir -p "$HOME/luals"
          curl -sL "$(curl -s https://api.github.com/repos/LuaLS/lua-language-server/releases/latest | jq -r '.assets[] | select(.name | endswith("linux-x64.tar.gz")) | .browser_download_url')" | tar -xz -C "$HOME/luals"
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"

      - name: Test cookiecutter
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          ./scripts/test_cookiecutter.sh
